services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-attendance-postgres
    environment:
      POSTGRES_DB: smart_attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d smart_attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
